services:
  backend:
    build: ./backend
    restart: unless-stopped

    environment:
      DB_PATH: /data/tasks.db

    volumes:
      - tasks_data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  tasks_data:
